# board.conf - board/machine configuration for the T480 build.
# NOT Kconfig: plain KEY=value, parsed line-by-line by build-firmware.py and
# build/apply-devicetree.sh (never sourced as shell). '#' starts a comment.
# Changes here need --rebuild-base.

# --- Network identity: MAC address -----------------------------------------
# The MAC of the onboard NIC is written into the GbE region at build time.
# This file is tracked in git - a MAC entered here shows up in your diffs.
# Prefer passing it per build instead:
#   MAC=AA:BB:CC:DD:EE:FF python3 scripts/build-firmware.py
# or:  python3 scripts/build-firmware.py --mac AA:BB:CC:DD:EE:FF
# The dummy below is deliberately commented out; without a MAC from one of
# the three sources (--mac, environment, this file) the build aborts.
# MAC=00:11:22:33:44:55

# --- Optional devicetree devices of the T480 port (y/n) --------------------
# build/apply-devicetree.sh inserts every device set to =y into
# src/mainboard/lenovo/sklkbl_thinkpad/devicetree.cb after
# "device ref hda on end" and removes it on =n (declarative, idempotent).
DT_DEVICE_SMBUS=y        # touchpad in RMI4/InterTouch mode (PCI 1f.4)
DT_DEVICE_HECI1=n        # HECI1 (PCI 16.0)
# Fast SPI visible again. It was set to =n because the kernel binds spi-intel
# to it and exposes the whole chip as an MTD device: a GbE write through
# /dev/mtd0 succeeded with SMM BWP and the WP_RO lock both active. /dev/mtd0 is
# the master device and carries none of the driver's per-partition write mask,
# so hiding the controller was the only thing standing in the way. The second
# protected range over SI_DESC + SI_GBE (patch 0043, defconfig) now blocks that
# write in the controller, which is where it belongs, so the device can be
# visible without handing anything away.
# Gains back fwupd's HSI SPI attributes, setpci, and flashrom without
# iomem=relaxed (with an MTD device it no longer falls back to mapping ECAM).
# Unverified until built and flashed - check /sys/firmware/log for both FPR
# lines and re-run the /dev/mtd0 GbE write test.
DT_DEVICE_FAST_SPI=y     # Fast SPI (PCI 1f.5)
